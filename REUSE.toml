version = 1
SPDX-PackageName = "deskflow"
SPDX-PackageSupplier = "Deskflow Devs"
SPDX-PackageDownloadLocation = "https://github.com/deskflow/deskflow"

[[annotations]]
path = [
   ".github/**"
 , ".clang-format"
 , ".editorconfig"
 , ".gitattributes"
 , ".gitignore"
 , "cspell.json"
 , "cmake/vcpkg.json.in"
 , "**/*.md"
 , "docs/**"
 , "deploy/linux/flatpak/**"
 , "deploy/linux/org.deskflow.deskflow.metainfo.xml"
 , "deploy/windows/wix-patch.xml.in"
 , "src/apps/deskflow-client/deskflow-client.exe.manifest"
 , "src/apps/deskflow-core/deskflow-core.exe.manifest"
 , "src/apps/deskflow-server/deskflow-server.exe.manifest"
 , "src/apps/res/manpage.txt"
 , "src/apps/res/deskflow.plist.in"
 , "src/apps/res/entitlements-dev.plist"
 , "translations/*.ts"
]
SPDX-FileCopyrightText = "Deskflow Developers"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
   "deploy/mac/dmg-background.tiff"
 , "deploy/mac/dmg-volume.icns"
 , "deploy/linux/org.deskflow.deskflow.png"
 , "deploy/windows/wix-banner.png"
 , "deploy/windows/wix-dialog.png"
 , "src/apps/res/icons/deskflow-**/apps/64/deskflow*.svg"
 , "src/apps/res/image/welcome.png"
 , "src/apps/res/Deskflow.icns"
 , "src/apps/res/deskflow.ico"
 , "src/apps/res/deskflow.qrc"
]
SPDX-FileCopyrightText = "Deskflow Developers"
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = "src/apps/res/icons/deskflow-**/**/**/**.svg"
SPDX-FileCopyrightText = "Kde Breeze Icons"
SPDX-License-Identifier = "LGPL-2.1-only"

[[annotations]]
path = "src/apps/res/icons/deskflow-**/index.theme"
SPDX-FileCopyrightText = "Chris Rizzitello <sithlord48@gmail.com>"
SPDX-License-Identifier = "LGPL-2.1-only"

[[annotations]]
path = [
   "src/lib/gui/MainWindow.ui"
 , "src/lib/gui/dialogs/*.ui"
]
SPDX-FileCopyrightText = "Deskflow Developers"
SPDX-License-Identifier = "GPL-2.0-only WITH LicenseRef-OpenSSL-Exception"

# Personal fork additions retain their own SPDX license expressions.
[[annotations]]
path = [
  "deploy/linux/build-personal.sh",
  "src/lib/gui/personal/DeviceIllustration.cpp",
  "src/lib/gui/personal/DeviceIllustration.h",
  "src/lib/gui/personal/PersonalStyle.cpp",
  "src/lib/gui/personal/PersonalStyle.h",
  "src/lib/gui/personal/PersonalWindow.cpp",
  "src/lib/gui/personal/PersonalWindow.h",
  "src/lib/gui/personal/PreferenceChanges.cpp",
  "src/lib/gui/personal/PreferenceChanges.h",
  "src/lib/gui/personal/ScreenLayoutPersistence.cpp",
  "src/lib/gui/personal/ScreenLayoutPersistence.h",
  "src/lib/gui/personal/ToggleSwitch.cpp",
  "src/lib/gui/personal/ToggleSwitch.h",
  "src/lib/platform/OSXShortcutMapper.cpp",
  "src/lib/platform/OSXShortcutMapper.h",
  "src/unittests/common/ShortcutMapperTests.cpp",
  "src/unittests/deskflow/ComputerShortcutTests.cpp",
  "src/unittests/gui/DeviceIllustrationTests.cpp",
  "src/unittests/gui/PersonalDialogTests.cpp",
  "src/unittests/gui/PersonalWindowTests.cpp",
  "src/unittests/gui/PreferenceChangesTests.cpp",
  "src/unittests/gui/PreferencesApplyControllerTests.cpp",
  "src/unittests/gui/ScreenLayoutPersistenceTests.cpp",
  "src/unittests/gui/ShortcutApplyControllerTests.cpp",
  "src/unittests/gui/ShortcutApplyControllerTests.h",
  "src/unittests/gui/config/ScreenLayoutTests.cpp",
  "tools/prepare_personal_server.py",
  "tools/test_prepare_personal_server.py",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 DeskBridge contributors"

[[annotations]]
path = [
  "VERSION",
  "deploy/mac/local.shuai.deskbridge.login.plist",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 DeskBridge contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  "src/apps/res/DeskBridge.icns",
  "src/apps/res/deskbridge.png",
  "src/apps/res/deskbridge.qrc",
  "src/apps/res/icons/deskbridge-tray.svg",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 DeskBridge contributors"
SPDX-License-Identifier = "GPL-2.0-only"

