name: DeskBridge Windows x64 packages

# Build on demand; the release owner attaches the verified files to a Release.
on:
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: Build and run only ShortcutRulesTests and SettingsTests; create no packages
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      # Only vcpkg's ABI-indexed dependency archives enter this directory.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/build/vcpkg-binary-cache,readwrite
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up MSVC x64
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: amd64
          spectre: true
      - name: Install pinned Qt
        uses: jurplel/install-qt-action@v4
        env:
          AQT_CONFIG: ${{ github.workspace }}/.github/actions/install-dependencies/aqt.ini
        with:
          version: '6.11.2'
          arch: win64_msvc2022_64
          archives: qtbase qtsvg qtdeclarative qttools qttranslations
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e
      - name: Fetch pinned vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          # Current tool scripts avoid removed MSYS2 runtime packages. The
          # manifest retains its independent, pinned dependency baseline.
          ref: 469a0504e4a6ebf6173d1c0f51a7fa34c382fd43
          path: deps/vcpkg
      - name: Restore pinned dependency binary cache
        id: dependency-cache
        uses: actions/cache/restore@v4
        with:
          path: build/vcpkg-binary-cache
          key: deskbridge-vcpkg-469a0504-windows-2022-x64-windows-release-v1
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/vcpkg-binary-cache | Out-Null
          & ./deps/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned installer compiler
        if: ${{ !inputs.diagnostics_only }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $download
          if ((Get-FileHash $download -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') {
              throw 'Installer compiler checksum mismatch.'
          }
          $destination = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $setup = Start-Process $download -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$destination`"") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer compiler setup failed: $($setup.ExitCode)" }
          "INNO_COMPILER=$destination/ISCC.exe" >> $env:GITHUB_ENV
      - name: Build, test and verify installer plus portable archive
        shell: pwsh
        env:
          DESKBRIDGE_DIAGNOSTICS_ONLY: ${{ inputs.diagnostics_only }}
        run: |
          $diagnosticsOnly = $env:DESKBRIDGE_DIAGNOSTICS_ONLY -eq 'true'
          ./deploy/windows/build-personal.ps1 -QtRoot $env:QT_ROOT_DIR -VcpkgRoot "$env:GITHUB_WORKSPACE/deps/vcpkg" -InnoSetupCompiler $env:INNO_COMPILER -DiagnosticsOnly:$diagnosticsOnly
      - name: Save dependency archives even after a later build or test failure
        if: always() && steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/vcpkg-binary-cache
          key: deskbridge-vcpkg-469a0504-windows-2022-x64-windows-release-v1
      - name: Upload Windows packages
        if: ${{ !inputs.diagnostics_only }}
        uses: actions/upload-artifact@v7
        with:
          name: deskbridge-windows-x64
          path: |
            dist/windows/deskbridge-*-setup.exe
            dist/windows/deskbridge-*-portable.zip
            dist/windows/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 30
      - name: Preserve failure diagnostics
        if: failure() || inputs.diagnostics_only
        uses: actions/upload-artifact@v7
        with:
          name: deskbridge-windows-x64-diagnostics
          # Only a failed full build can create notices/packages; diagnostics-only
          # builds return before either step. These files remain diagnostics.
          path: |
            build/personal-windows-x64/Testing/Temporary/
            build/personal-windows-x64/src/unittests/Testing/Temporary/
            build/personal-windows-x64/installer-smoke.log
            build/personal-windows-x64/ThirdPartyLicenses/
            dist/windows/
          if-no-files-found: ignore
          retention-days: 14
